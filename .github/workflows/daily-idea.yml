name: Dagens idé (SMS)

on:
  schedule:
    # GitHub kör i UTC. Två körningar täcker både vinter- och sommartid;
    # skriptet skickar bara en gång per dag, när klockan i Stockholm passerat send_hour.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Skicka direkt (ignorera tid och historik)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-idea
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera beroenden
        run: pip install -r daily-idea-sms/requirements.txt

      - name: Skicka dagens idé
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMS_PROVIDER: ${{ vars.SMS_PROVIDER || '46elks' }}
          SMS_TO: ${{ secrets.SMS_TO }}
          SMS_FROM: ${{ vars.SMS_FROM || 'DagensIde' }}
          ELKS_API_USERNAME: ${{ secrets.ELKS_API_USERNAME }}
          ELKS_API_PASSWORD: ${{ secrets.ELKS_API_PASSWORD }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python daily-idea-sms/daily_idea.py --force
          else
            python daily-idea-sms/daily_idea.py
          fi

      - name: Spara historik (så att idéer inte upprepas)
        run: |
          if [ -n "$(git status --porcelain daily-idea-sms/history.json)" ]; then
            git config user.name "dagens-ide-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add daily-idea-sms/history.json
            git commit -m "Dagens idé: uppdatera historik"
            git push
          fi
